services:
  trustlens:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trustlens-ai
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - RATE_LIMIT_PER_MINUTE=30
      - MAX_UPLOAD_SIZE_BYTES=10485760
      - MAX_PDF_PAGES=10
      - GEMMA_API_KEY=${GEMMA_API_KEY:-}
      - GEMMA_MODEL_ID=${GEMMA_MODEL_ID:-gemma-4-31b-it}
      - GEMMA_API_BASE=${GEMMA_API_BASE:-https://generativelanguage.googleapis.com/v1beta}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
